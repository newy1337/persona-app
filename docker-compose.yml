# Установка с нуля: `cp .env.example .env`, заполнить, `docker compose up -d --build`.
# Панель и API отвечают на одном адресе, поэтому CORS не нужен.
#
# Состояние лежит в обычных каталогах хоста, а не в томах Docker: `docker compose
# down -v` и `docker system prune --volumes` до них не дотянутся. Корень задаётся
# через DATA_ROOT в .env, по умолчанию /srv/persona-data.
#
# Каталоги нужно создать заранее и отдать их владельцам из контейнеров:
#   sudo mkdir -p /srv/persona-data/{pgdata,app}
#   sudo chown 70:70     /srv/persona-data/pgdata   # postgres в alpine-образе
#   sudo chown 1000:1000 /srv/persona-data/app      # node в образе бэкенда

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nastya}
      POSTGRES_USER: ${POSTGRES_USER:-nastya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - ${DATA_ROOT:-/srv/persona-data}/pgdata:/var/lib/postgresql/data

    expose:
      - "5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nastya} -d ${POSTGRES_DB:-nastya}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nastya}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nastya}?schema=public
      DATA_DIR: /app/data
      PERSONAS_DIR: /app/data/personas
    volumes:
      - ${DATA_ROOT:-/srv/persona-data}/app:/app/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8011"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s

      start_period: 180s
      retries: 3

  panel:
    build: ./frontend/manager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${PANEL_PORT:-8080}:80"
