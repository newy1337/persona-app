# База для тестов: поднимается отдельно от рабочего стека и живёт в памяти
# контейнера — после `down` от неё не остаётся ничего.
#   docker compose -f docker-compose.test.yml up -d
#   cd backend && npm run test:e2e
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nastya_test
      POSTGRES_USER: nastya
      POSTGRES_PASSWORD: nastya
    ports:

      - "5436:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nastya -d nastya_test"]
      interval: 5s
      timeout: 5s
      retries: 10
