server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Голосовые от войсера приходят сырым телом.
    client_max_body_size 25m;

    # Ответы API — JSON на сотни килобайт; без сжатия список диалогов едет секунду.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    # Звонки идут по WebSocket: обычного проксирования им мало, нужен Upgrade.
    location = /api/voicer/call/ws {
        proxy_pass http://backend:8011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location ~ ^/(api|auth|sse|docs|health)(/|$) {
        proxy_pass http://backend:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Долгие ответы моделей и потоки событий.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Имена файлов сборки содержат хеш — их можно кешировать надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Любой маршрут панели отдаёт index.html: разбор адреса — дело браузера.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
