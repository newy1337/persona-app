name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nastya_test
          POSTGRES_USER: nastya
          POSTGRES_PASSWORD: nastya
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U nastya -d nastya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/manager-frontend/package-lock.json

      - name: backend · install
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: backend · lint
        working-directory: backend
        run: npx eslint "{src,test}/**/*.ts"

      - name: backend · unit tests
        working-directory: backend
        run: npx jest --ci

      - name: backend · build
        working-directory: backend
        run: npm run build

      - name: backend · e2e tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://nastya:nastya@127.0.0.1:5436/nastya_test
        run: npx jest --ci --config ./test/jest-e2e.json

      - name: frontend · install
        working-directory: frontend/manager-frontend
        run: npm ci --no-audit --no-fund

      - name: frontend · lint
        working-directory: frontend/manager-frontend
        run: npm run lint

      - name: frontend · tests
        working-directory: frontend/manager-frontend
        run: npx vitest run

      - name: frontend · build
        working-directory: frontend/manager-frontend
        run: npm run build

      - name: docker · build images
        env:
          POSTGRES_PASSWORD: ci
        run: docker compose build --quiet

  deploy:
    name: deploy
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on:
      - self-hosted
      - ${{ github.ref == 'refs/heads/main' && 'persona' || 'persona-dev' }}
    timeout-minutes: 30
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ vars.PANEL_URL }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: update and deploy
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/persona-app' }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch --prune origin
          git checkout --quiet --force "$GITHUB_SHA"
          bash deploy/deploy.sh "$GITHUB_SHA"

  notify:
    name: notify
    needs: [checks, deploy]
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: telegram
        env:
          BOT_TOKEN: ${{ secrets.TG_NOTIFY_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
          CHECKS: ${{ needs.checks.result }}
          DEPLOY: ${{ needs.deploy.result }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "TG_NOTIFY_BOT_TOKEN / TG_NOTIFY_CHAT_ID not set, skipping"
            exit 0
          fi
          if [ "$DEPLOY" = "success" ]; then
            TITLE="✅ Деплой прошёл ($BRANCH)"
          elif [ "$CHECKS" != "success" ]; then
            TITLE="❌ Проверки упали, деплоя не было"
          else
            TITLE="🔥 Деплой упал ($BRANCH, $DEPLOY)"
          fi
          FIRST_LINE="$(printf '%s' "$MESSAGE" | head -n1)"
          TEXT="$(printf '%s\n%s @ %s by %s\n%s\nchecks: %s · deploy: %s\n%s' \
            "$TITLE" "$REPO" "${SHA:0:7}" "$ACTOR" "$FIRST_LINE" "$CHECKS" "$DEPLOY" "$RUN_URL")"
          send() {
            curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=$1" \
              --data-urlencode "text=${TEXT}" \
              --data-urlencode "disable_web_page_preview=true"
          }
          RESPONSE="$(send "$CHAT_ID")"
          NEW_ID="$(printf '%s' "$RESPONSE" | sed -nE 's/.*"migrate_to_chat_id":(-?[0-9]+).*/\1/p')"
          if [ -n "$NEW_ID" ]; then
            echo "::warning::chat migrated to $NEW_ID, update the TG_NOTIFY_CHAT_ID secret"
            RESPONSE="$(send "$NEW_ID")"
          fi
          if printf '%s' "$RESPONSE" | grep -q '"ok":true'; then
            echo "sent"
          else
            echo "telegram error: $(printf '%s' "$RESPONSE" | sed -E 's/"ok":false,?//')"
            exit 1
          fi
